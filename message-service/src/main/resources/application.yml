server:
  port: 8085

spring:
  application:
    name: message-service
  datasource:
    # RabbitMQ demo 的本地消息表使用文件型 H2，方便学习时重启服务后继续观察 outbox 记录。
    # 面试回答时要强调：生产环境本地消息表应换成 MySQL 等业务库，并和订单等业务数据放在同一个数据库事务里。
    url: ${MESSAGE_DB_URL:jdbc:h2:file:./data/message-service;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      # 启动 message-service 时自动创建 mq_outbox_message 表。
      mode: always
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    function:
      # 完整下单链路消费 order-service 发布的业务事件；RabbitMQ demo 仍然使用 @RabbitListener。
      definition: bookingCreatedRabbit;bookingCreatedKafka
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:pro}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:pro}
        file-extension: yaml
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
    stream:
      binders:
        rabbit:
          type: rabbit
        kafka:
          type: kafka
      bindings:
        bookingCreatedRabbit-in-0:
          binder: rabbit
          destination: hotel.booking.created
          group: message-service
          content-type: application/json
        bookingCreatedKafka-in-0:
          binder: kafka
          destination: hotel-booking-created
          group: message-service
          content-type: application/json
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
  kafka:
    # Spring Kafka 原生客户端地址；Docker profile 启动时由 KAFKA_BOOTSTRAP_SERVERS=kafka:9092 指向容器名。
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
  rabbitmq:
    # RabbitMQ Broker 地址；Docker profile 启动时由 RABBITMQ_HOST=rabbitmq 指向容器名。
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 开启 publisher confirm。correlated 表示用 CorrelationData 关联“哪条消息”的 ack/nack。
    publisher-confirm-type: correlated
    # 开启 publisher return。配合 template.mandatory=true 捕获“到达 exchange 但没有路由到 queue”的消息。
    publisher-returns: true
    template:
      # mandatory=true 是不可路由消息能被 return callback 感知的关键开关。
      mandatory: true
    listener:
      simple:
        # 消费者手动 ACK：业务成功后 basicAck，失败时 basicNack/basicReject。
        acknowledge-mode: manual
        # 默认不要把监听器异常重新入队，避免失败消息无限重试；本 demo 里显式 nack 进 DLQ。
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
