server:
  port: 8085

spring:
  application:
    name: message-service
  datasource:
    # RabbitMQ demo 的本地消息表使用文件型 H2，方便学习时重启服务后继续观察 outbox 记录。
    # 面试回答时要强调：生产环境本地消息表应换成 MySQL 等业务库，并和订单等业务数据放在同一个数据库事务里。
    url: ${MESSAGE_DB_URL:jdbc:h2:file:./data/message-service;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      # 启动时以幂等 DDL 创建 RabbitMQ outbox/DLQ 和 Kafka 去重/DLT 工单表。
      mode: always
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:pro}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:pro}
        file-extension: yaml
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
