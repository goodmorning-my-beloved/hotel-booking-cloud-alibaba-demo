spring:
  cloud:
    function:
      # 完整下单链路消费 order-service 发布的业务事件；RabbitMQ demo 仍然使用 @RabbitListener。
      definition: bookingCreatedRabbit;bookingCreatedKafka
    stream:
      binders:
        rabbit:
          type: rabbit
        kafka:
          type: kafka
      bindings:
        bookingCreatedRabbit-in-0:
          binder: rabbit
          destination: hotel.booking.created
          group: message-service
          content-type: application/json
        bookingCreatedKafka-in-0:
          binder: kafka
          destination: hotel-booking-created
          group: message-service
          content-type: application/json
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
  kafka:
    # Spring Kafka 原生客户端地址；Docker profile 启动时由 KAFKA_BOOTSTRAP_SERVERS=kafka:9092 指向容器名。
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
  rabbitmq:
    # RabbitMQ Broker 地址；Docker profile 启动时由 RABBITMQ_HOST=rabbitmq 指向容器名。
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 开启 publisher confirm。correlated 表示用 CorrelationData 关联“哪条消息”的 ack/nack。
    publisher-confirm-type: correlated
    # 开启 publisher return。配合 template.mandatory=true 捕获“到达 exchange 但没有路由到 queue”的消息。
    publisher-returns: true
    template:
      # mandatory=true 是不可路由消息能被 return callback 感知的关键开关。
      mandatory: true
    listener:
      simple:
        # 消费者手动 ACK：业务成功后 basicAck，失败时 basicNack/basicReject。
        acknowledge-mode: manual
        # 默认不要把监听器异常重新入队，避免失败消息无限重试；本 demo 里显式 nack 进 DLQ。
        default-requeue-rejected: false

hotel:
  kafka:
    demo:
      topic: hotel.kafka.demo.orders
      dead-letter-topic: hotel.kafka.demo.orders.DLT
      partitions: 3
      replicas: 1
      retention-ms: 86400000
      dead-letter-retention-ms: 604800000
      acks: all
      idempotence-enabled: true
      # 幂等 producer 的客户端重试由 delivery.timeout.ms 设最终时间边界，避免只重试几次就过早失败。
      retries: 2147483647
      linger-ms: 5
      batch-size: 32768
      compression-type: lz4
      delivery-timeout-ms: 120000
      max-in-flight-requests-per-connection: 5
      # 多实例部署时必须唯一；Docker 容器 HOSTNAME 天然不同，可 fencing 重启前遗留的 zombie producer。
      transaction-id-prefix: ${KAFKA_TRANSACTION_ID_PREFIX:hotel-kafka-demo-${HOSTNAME:local}-}
      max-poll-records: 10
      auto-offset-reset: earliest
      listener-concurrency: 2
      retry-backoff-ms: 500
      # FixedBackOff 的第二个参数表示“重试次数”，不包含第一次消费；2 表示最多投递 3 次。
      retry-max-retries: 2
      consumer-groups:
        primary: hotel-kafka-demo-primary
        audit: hotel-kafka-demo-audit
        dead-letter: hotel-kafka-demo-dlt
  rabbitmq:
    demo:
      booking-exchange: hotel.booking.exchange
      booking-routing-key: hotel.booking.created
      booking-queue: hotel.booking.created.queue
      dead-letter-exchange: hotel.booking.dlx
      dead-letter-routing-key: hotel.booking.created.dead
      dead-letter-queue: hotel.booking.created.dlq
      topic-exchange: hotel.booking.topic.exchange
      topic-single-word-pattern: hotel.booking.*
      topic-multi-word-pattern: hotel.booking.#
      topic-single-word-queue: hotel.booking.topic.single-word.queue
      topic-multi-word-queue: hotel.booking.topic.multi-word.queue
      fanout-exchange: hotel.booking.fanout.exchange
      fanout-sms-queue: hotel.booking.fanout.sms.queue
      fanout-points-queue: hotel.booking.fanout.points.queue
