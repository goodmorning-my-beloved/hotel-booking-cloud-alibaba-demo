spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hotel_demo}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:hotel_demo}
    password: ${MYSQL_PASSWORD:hotel_demo_pass}
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${MYSQL_MAX_POOL_SIZE:6}
      minimum-idle: ${MYSQL_MIN_IDLE:1}
      connection-timeout: 3000
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000
  sql:
    init:
      mode: always
  cloud:
    stream:
      binders:
        # Spring Cloud Stream 的 binder 可以理解为“把统一消息 API 接到具体 MQ 产品”的适配器。
        rabbit:
          type: rabbit
        kafka:
          type: kafka
      bindings:
        bookingCreatedRabbit-out-0:
          # 这条 binding 对应 OrderService 里的 streamBridge.send("bookingCreatedRabbit-out-0", event)。
          binder: rabbit
          # 对 Rabbit binder 来说，destination 通常会映射为 RabbitMQ exchange。
          destination: hotel.booking.created
          content-type: application/json
        bookingCreatedKafka-out-0:
          binder: kafka
          destination: hotel-booking-created
          content-type: application/json
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
  rabbitmq:
    # Rabbit binder 底层仍然要连接 RabbitMQ Broker，这里配置连接地址和账号。
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
