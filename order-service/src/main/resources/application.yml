server:
  port: 8083

spring:
  application:
    name: order-service
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:pro}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:pro}
        file-extension: yaml
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
    stream:
      binders:
        rabbit:
          type: rabbit
        kafka:
          type: kafka
      bindings:
        bookingCreatedRabbit-out-0:
          binder: rabbit
          destination: hotel.booking.created
          content-type: application/json
        bookingCreatedKafka-out-0:
          binder: kafka
          destination: hotel-booking-created
          content-type: application/json
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

feign:
  sentinel:
    enabled: true

seata:
  enabled: ${SEATA_ENABLED:true}
  application-id: ${spring.application.name}
  tx-service-group: hotel_tx_group
  service:
    vgroup-mapping:
      hotel_tx_group: default
    grouplist:
      default: ${SEATA_ADDR:127.0.0.1:8091}

management:
  endpoints:
    web:
      exposure:
        include: health,info
