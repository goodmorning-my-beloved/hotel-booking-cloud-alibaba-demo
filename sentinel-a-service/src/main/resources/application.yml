server:
  port: 8087

spring:
  application:
    name: sentinel-a-service
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      datasource:
        a-degrade:
          nacos:
            server-addr: ${NACOS_ADDR:127.0.0.1:8848}
            data-id: sentinel-a-service-degrade-rules.json
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: degrade

feign:
  sentinel:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
